
name: SENAMHI Nowcasting - ArcGIS Online

on:
  schedule:
    - cron: '3,23,43 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar conexión WFS
        run: python test_wfs.py
